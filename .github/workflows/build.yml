name: Build ddclient

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build even if this version already exists"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  packages: write

env:
  LSIO_REPOSITORY: linuxserver/docker-ddclient
  DDCLIENT_REPOSITORY: ddclient/ddclient

jobs:
  check:
    name: Check upstream releases
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.check_image.outputs.build_required }}
      ddclient_version: ${{ steps.versions.outputs.ddclient_version }}
      lsio_version: ${{ steps.versions.outputs.lsio_version }}
      lsio_build: ${{ steps.versions.outputs.lsio_build }}
      lsio_tag: ${{ steps.versions.outputs.lsio_tag }}
      image_name: ${{ steps.image.outputs.image_name }}
      image_tag: ${{ steps.versions.outputs.image_tag }}

    steps:
      - name: Determine image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_NAME}"

      - name: Get latest upstream releases
        id: versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Getting latest LinuxServer release..."

          LSIO_JSON=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${LSIO_REPOSITORY}/releases/latest")

          LSIO_TAG=$(echo "$LSIO_JSON" | jq -r '.tag_name')

          if [[ -z "$LSIO_TAG" || "$LSIO_TAG" == "null" ]]; then
            echo "ERROR: Could not determine latest LinuxServer release."
            exit 1
          fi

          if [[ ! "$LSIO_TAG" =~ -ls([0-9]+)$ ]]; then
            echo "ERROR: Unexpected LinuxServer release tag: ${LSIO_TAG}"
            exit 1
          fi

          LSIO_BUILD="${BASH_REMATCH[1]}"
          LSIO_VERSION="${LSIO_TAG%-ls${LSIO_BUILD}}"

          echo "Getting newest published ddclient release including prereleases..."

          DDCLIENT_JSON=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DDCLIENT_REPOSITORY}/releases?per_page=100")

          DDCLIENT_VERSION=$(echo "$DDCLIENT_JSON" | jq -r \
            '[.[] |
                select(
                  .draft == false and
                  .published_at != null
                )
              ] |
              sort_by(.published_at) |
              reverse |
              .[0].tag_name')

          if [[ -z "$DDCLIENT_VERSION" || "$DDCLIENT_VERSION" == "null" ]]; then
            echo "ERROR: Could not determine latest ddclient release."
            exit 1
          fi

          IMAGE_TAG="${DDCLIENT_VERSION}-ls${LSIO_BUILD}"

          echo
          echo "Detected versions:"
          echo "  LinuxServer release : ${LSIO_TAG}"
          echo "  LinuxServer version : ${LSIO_VERSION}"
          echo "  LinuxServer build   : ls${LSIO_BUILD}"
          echo "  ddclient release    : ${DDCLIENT_VERSION}"
          echo "  Resulting image tag : ${IMAGE_TAG}"

          echo "lsio_tag=${LSIO_TAG}" >> "$GITHUB_OUTPUT"
          echo "lsio_version=${LSIO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "lsio_build=${LSIO_BUILD}" >> "$GITHUB_OUTPUT"
          echo "ddclient_version=${DDCLIENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check whether image already exists
        id: check_image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          set -euo pipefail

          echo "Checking ${IMAGE_NAME}:${IMAGE_TAG}"

          if [[ "$FORCE_BUILD" == "true" ]]; then
            echo "Force build requested."
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if docker manifest inspect "${IMAGE_NAME}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Image already exists."
            echo "No build required."
            echo "build_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist."
            echo "Build required."
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish image
    needs: check
    if: needs.check.outputs.build_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LinuxServer release
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LSIO_REPOSITORY }}
          ref: ${{ needs.check.outputs.lsio_tag }}
          fetch-depth: 0

      - name: Verify LinuxServer checkout
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.check.outputs.lsio_tag }}
        run: |
          set -euo pipefail

          ACTUAL_COMMIT=$(git rev-parse HEAD)
          TAG_COMMIT=$(git rev-list -n 1 "${EXPECTED_TAG}")

          echo "Expected LinuxServer tag : ${EXPECTED_TAG}"
          echo "Checked out commit       : ${ACTUAL_COMMIT}"
          echo "Tag points to commit      : ${TAG_COMMIT}"

          if [[ "${ACTUAL_COMMIT}" != "${TAG_COMMIT}" ]]; then
            echo "ERROR: Checked out commit does not match LinuxServer tag ${EXPECTED_TAG}."
            exit 1
          fi

          echo "LinuxServer checkout verified successfully."

          echo "LSIO_COMMIT=${ACTUAL_COMMIT}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: project
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record project revision
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_COMMIT=$(git -C project rev-parse HEAD)

          if [[ "${PROJECT_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "ERROR: Project checkout does not match workflow commit."
            echo "Expected: ${GITHUB_SHA}"
            echo "Actual  : ${PROJECT_COMMIT}"
            exit 1
          fi

          echo "PROJECT_COMMIT=${PROJECT_COMMIT}" >> "$GITHUB_ENV"
          echo "Project revision: ${PROJECT_COMMIT}"

      - name: Prepare corresponding source archives
        shell: bash
        env:
          LSIO_TAG: ${{ needs.check.outputs.lsio_tag }}
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
          IMAGE_TAG: ${{ needs.check.outputs.image_tag }}
          IMAGE_NAME: ${{ needs.check.outputs.image_name }}
        run: |
          set -euo pipefail

          SOURCE_DIR="${RUNNER_TEMP}/source"
          DDCLIENT_EXTRACT_DIR="${RUNNER_TEMP}/ddclient-source"

          mkdir -p "${SOURCE_DIR}"
          mkdir -p "${DDCLIENT_EXTRACT_DIR}"

          echo "Creating LinuxServer source archive..."

          git archive \
            --format=tar.gz \
            --prefix="linuxserver-docker-ddclient-${LSIO_TAG}/" \
            --output="${SOURCE_DIR}/linuxserver-docker-ddclient-${LSIO_TAG}.tar.gz" \
            "${LSIO_TAG}"

          echo "Copying LinuxServer license..."

          if [[ ! -f LICENSE ]]; then
            echo "ERROR: LinuxServer LICENSE file not found."
            exit 1
          fi

          cp LICENSE \
            "${SOURCE_DIR}/LICENSE-linuxserver-docker-ddclient"

          echo "Downloading exact ddclient source archive..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output "${SOURCE_DIR}/ddclient-${DDCLIENT_VERSION}.tar.gz" \
            "https://github.com/${DDCLIENT_REPOSITORY}/archive/refs/tags/${DDCLIENT_VERSION}.tar.gz"

          echo "Extracting ddclient license information..."

          tar \
            -xzf "${SOURCE_DIR}/ddclient-${DDCLIENT_VERSION}.tar.gz" \
            -C "${DDCLIENT_EXTRACT_DIR}"

          DDCLIENT_SOURCE_ROOT=$(find "${DDCLIENT_EXTRACT_DIR}" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            -quit)

          if [[ -z "${DDCLIENT_SOURCE_ROOT}" ]]; then
            echo "ERROR: Could not determine extracted ddclient source directory."
            exit 1
          fi

          if [[ ! -f "${DDCLIENT_SOURCE_ROOT}/COPYING" ]]; then
            echo "ERROR: ddclient COPYING file not found."
            exit 1
          fi

          if [[ ! -f "${DDCLIENT_SOURCE_ROOT}/COPYRIGHT" ]]; then
            echo "ERROR: ddclient COPYRIGHT file not found."
            exit 1
          fi

          cp "${DDCLIENT_SOURCE_ROOT}/COPYING" \
            "${SOURCE_DIR}/LICENSE-ddclient"

          cp "${DDCLIENT_SOURCE_ROOT}/COPYRIGHT" \
            "${SOURCE_DIR}/COPYRIGHT-ddclient"

          echo "Copying project-owned final-image files..."

          if [[ ! -f project/Dockerfile ]]; then
            echo "ERROR: Project Dockerfile not found."
            exit 1
          fi

          if [[ ! -f project/root/etc/s6-overlay/s6-rc.d/init-adduser/branding ]]; then
            echo "ERROR: Project branding file not found."
            exit 1
          fi

          cp project/Dockerfile \
            "${SOURCE_DIR}/Dockerfile-final"

          cp project/root/etc/s6-overlay/s6-rc.d/init-adduser/branding \
            "${SOURCE_DIR}/branding"

          echo "Creating source information..."

          cat > "${SOURCE_DIR}/SOURCE_INFO.txt" <<EOF
          Image:
          ${IMAGE_NAME}:${IMAGE_TAG}

          Direct upstream sources used by this build:

          LinuxServer.io docker-ddclient
          Repository: https://github.com/${LSIO_REPOSITORY}
          Release: ${LSIO_TAG}
          Commit: ${LSIO_COMMIT}
          License: GPL-3.0
          Source archive: linuxserver-docker-ddclient-${LSIO_TAG}.tar.gz
          License file: LICENSE-linuxserver-docker-ddclient

          ddclient
          Repository: https://github.com/${DDCLIENT_REPOSITORY}
          Release: ${DDCLIENT_VERSION}
          License: GPL-2.0-or-later
          Source archive: ddclient-${DDCLIENT_VERSION}.tar.gz
          License file: LICENSE-ddclient
          Copyright file: COPYRIGHT-ddclient

          Final image wrapper
          Repository: https://github.com/${GITHUB_REPOSITORY}
          Commit: ${PROJECT_COMMIT}
          License: GPL-3.0
          Build file: Dockerfile-final
          Branding file: branding

          The LinuxServer.io source archive preserves the exact upstream release
          selected by this build and is built unchanged as an intermediate image.

          Dockerfile-final and branding are the project-owned final-image layer
          used to distinguish the independently published image from the
          LinuxServer.io upstream image. The wrapper does not modify the archived
          LinuxServer.io source tree.

          The resulting container image additionally contains the LinuxServer.io
          base image, Alpine Linux packages, Perl modules and other third-party
          components. Those components remain subject to their respective
          copyright and license terms.

          SBOM.spdx.json inventories components detected in the final built image.

          Publication of these source archives and license files does not
          relicense any upstream component.
          EOF

          echo
          echo "Prepared source and license files:"
          ls -lh "${SOURCE_DIR}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.check.outputs.image_name }}
          IMAGE_TAG: ${{ needs.check.outputs.image_tag }}
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
          LSIO_BUILD: ${{ needs.check.outputs.lsio_build }}
          LSIO_TAG: ${{ needs.check.outputs.lsio_tag }}
        run: |
          set -euo pipefail

          UPSTREAM_IMAGE="${IMAGE_NAME}:upstream-${IMAGE_TAG}"

          echo "Building unchanged LinuxServer.io upstream source..."

          docker build \
            --pull \
            --build-arg DDCLIENT_VERSION="${DDCLIENT_VERSION}" \
            --build-arg VERSION="${IMAGE_TAG}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            -t "${UPSTREAM_IMAGE}" \
            .

          echo "Building independently branded final image..."

          docker build \
            --build-arg UPSTREAM_IMAGE="${UPSTREAM_IMAGE}" \
            --build-arg IMAGE_VERSION="${IMAGE_TAG}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg DDCLIENT_VERSION="${DDCLIENT_VERSION}" \
            --build-arg LSIO_TAG="${LSIO_TAG}" \
            --build-arg LSIO_COMMIT="${LSIO_COMMIT}" \
            --build-arg PROJECT_COMMIT="${PROJECT_COMMIT}" \
            -f project/Dockerfile \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${DDCLIENT_VERSION}" \
            -t "${IMAGE_NAME}:ls${LSIO_BUILD}" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            project

      - name: Verify image identity and branding
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.check.outputs.image_name }}
          IMAGE_TAG: ${{ needs.check.outputs.image_tag }}
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
          LSIO_TAG: ${{ needs.check.outputs.lsio_tag }}
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          get_label() {
            docker image inspect \
              --format "{{ index .Config.Labels \"$1\" }}" \
              "${IMAGE}"
          }

          assert_label() {
            local key="$1"
            local expected="$2"
            local actual

            actual="$(get_label "${key}")"

            if [[ "${actual}" != "${expected}" ]]; then
              echo "ERROR: Unexpected image label ${key}"
              echo "Expected: ${expected}"
              echo "Actual  : ${actual}"
              exit 1
            fi
          }

          assert_label "maintainer" "fwe86"
          assert_label "org.opencontainers.image.authors" "fwe86"
          assert_label "org.opencontainers.image.vendor" "fwe86"
          assert_label "org.opencontainers.image.title" "docker-ddclient"
          assert_label "org.opencontainers.image.source" \
            "https://github.com/${GITHUB_REPOSITORY}"
          assert_label "org.opencontainers.image.version" "${IMAGE_TAG}"
          assert_label "org.opencontainers.image.revision" "${PROJECT_COMMIT}"
          assert_label "io.github.fwe86.ddclient.version" "${DDCLIENT_VERSION}"
          assert_label "io.github.fwe86.linuxserver.release" "${LSIO_TAG}"
          assert_label "io.github.fwe86.linuxserver.revision" "${LSIO_COMMIT}"

          BUILD_LABEL="$(get_label build_version)"

          if grep -Fqi "Linuxserver.io version" <<< "${BUILD_LABEL}"; then
            echo "ERROR: LinuxServer.io build branding is still present in build_version."
            exit 1
          fi

          if ! grep -Fq "fwe86/docker-ddclient version:" <<< "${BUILD_LABEL}"; then
            echo "ERROR: Project build_version label is missing."
            exit 1
          fi

          if ! docker image inspect \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "${IMAGE}" | grep -Fxq 'LSIO_FIRST_PARTY=false'; then
            echo "ERROR: LSIO_FIRST_PARTY=false is not set."
            exit 1
          fi

          BUILD_VERSION_CONTENT=$(docker run --rm \
            --entrypoint cat \
            "${IMAGE}" \
            /build_version)

          echo "${BUILD_VERSION_CONTENT}"

          if grep -Fqi "Linuxserver.io version:" <<< "${BUILD_VERSION_CONTENT}"; then
            echo "ERROR: LinuxServer.io /build_version branding is still present."
            exit 1
          fi

          if ! grep -Fq "fwe86/docker-ddclient version: ${IMAGE_TAG}" \
            <<< "${BUILD_VERSION_CONTENT}"; then
            echo "ERROR: Project /build_version identification is missing."
            exit 1
          fi

          if ! grep -Fq "LinuxServer.io docker-ddclient source: ${LSIO_TAG}" \
            <<< "${BUILD_VERSION_CONTENT}"; then
            echo "ERROR: Upstream provenance is missing from /build_version."
            exit 1
          fi

          BRANDING_CONTENT=$(docker run --rm \
            --entrypoint cat \
            "${IMAGE}" \
            /etc/s6-overlay/s6-rc.d/init-adduser/branding)

          echo "${BRANDING_CONTENT}"

          if ! grep -Fq "fwe86/docker-ddclient" <<< "${BRANDING_CONTENT}"; then
            echo "ERROR: Custom container branding is missing."
            exit 1
          fi

          echo "Image identity and branding verified successfully."

      - name: Verify ddclient version
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.check.outputs.image_name }}
          IMAGE_TAG: ${{ needs.check.outputs.image_tag }}
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
        run: |
          set -euo pipefail

          OUTPUT=$(docker run --rm \
            --entrypoint ddclient \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --version)

          echo "$OUTPUT"

          EXPECTED_VERSION="${DDCLIENT_VERSION#v}"

          if ! grep -Fq "ddclient version ${EXPECTED_VERSION}" <<< "$OUTPUT"; then
            echo "ERROR: Built ddclient version does not match ${DDCLIENT_VERSION}."
            exit 1
          fi

          echo "Verified ddclient ${EXPECTED_VERSION} successfully."

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.check.outputs.image_name }}:${{ needs.check.outputs.image_tag }}
          format: spdx-json
          output-file: ${{ runner.temp }}/source/SBOM.spdx.json
          artifact-name: SBOM-${{ needs.check.outputs.image_tag }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Verify SBOM and create checksums
        shell: bash
        env:
          LSIO_TAG: ${{ needs.check.outputs.lsio_tag }}
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
        run: |
          set -euo pipefail

          SOURCE_DIR="${RUNNER_TEMP}/source"

          if [[ ! -s "${SOURCE_DIR}/SBOM.spdx.json" ]]; then
            echo "ERROR: SBOM.spdx.json was not created or is empty."
            exit 1
          fi

          if ! jq -e '.spdxVersion and .packages' \
            "${SOURCE_DIR}/SBOM.spdx.json" >/dev/null; then
            echo "ERROR: SBOM.spdx.json is not a valid SPDX JSON document."
            exit 1
          fi

          (
            cd "${SOURCE_DIR}"

            sha256sum \
              "linuxserver-docker-ddclient-${LSIO_TAG}.tar.gz" \
              "ddclient-${DDCLIENT_VERSION}.tar.gz" \
              "LICENSE-linuxserver-docker-ddclient" \
              "LICENSE-ddclient" \
              "COPYRIGHT-ddclient" \
              "Dockerfile-final" \
              "branding" \
              "SOURCE_INFO.txt" \
              "SBOM.spdx.json" \
              > SHA256SUMS
          )

          echo
          echo "Final release assets:"
          ls -lh "${SOURCE_DIR}"
          echo
          echo "Checksums:"
          cat "${SOURCE_DIR}/SHA256SUMS"

      - name: Push images
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.check.outputs.image_name }}
          IMAGE_TAG: ${{ needs.check.outputs.image_tag }}
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
          LSIO_BUILD: ${{ needs.check.outputs.lsio_build }}
        run: |
          set -euo pipefail

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${DDCLIENT_VERSION}"
          docker push "${IMAGE_NAME}:ls${LSIO_BUILD}"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Publish source release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.check.outputs.image_tag }}
          IMAGE_NAME: ${{ needs.check.outputs.image_name }}
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
          LSIO_TAG: ${{ needs.check.outputs.lsio_tag }}
        run: |
          set -euo pipefail

          SOURCE_DIR="${RUNNER_TEMP}/source"
          RELEASE_TAG="image-${IMAGE_TAG}"
          RELEASE_TITLE="${IMAGE_TAG}"

          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Docker image:

          \`${IMAGE_NAME}:${IMAGE_TAG}\`

          Upstream versions:

          - ddclient: \`${DDCLIENT_VERSION}\`
          - LinuxServer.io docker-ddclient: \`${LSIO_TAG}\`

          ## Source and compliance material

          The attached archives contain the exact ddclient and LinuxServer.io
          docker-ddclient source versions selected by this build.

          \`Dockerfile-final\` and \`branding\` are the exact project-owned
          final-image files used to distinguish this independently published image
          from LinuxServer.io.

          \`SBOM.spdx.json\` is an SPDX JSON software bill of materials generated
          from the final built container image.

          \`SHA256SUMS\` contains checksums for all attached source, license,
          copyright, wrapper, provenance, and SBOM files.

          The Docker image also contains third-party packages from the
          LinuxServer.io Alpine base image and Alpine repositories. Those
          components remain subject to their respective licenses.

          This is an independent project and is not affiliated with, endorsed by,
          or maintained by LinuxServer.io or the ddclient project.
          EOF

          ASSETS=(
            "${SOURCE_DIR}/linuxserver-docker-ddclient-${LSIO_TAG}.tar.gz"
            "${SOURCE_DIR}/ddclient-${DDCLIENT_VERSION}.tar.gz"
            "${SOURCE_DIR}/LICENSE-linuxserver-docker-ddclient"
            "${SOURCE_DIR}/LICENSE-ddclient"
            "${SOURCE_DIR}/COPYRIGHT-ddclient"
            "${SOURCE_DIR}/Dockerfile-final"
            "${SOURCE_DIR}/branding"
            "${SOURCE_DIR}/SOURCE_INFO.txt"
            "${SOURCE_DIR}/SBOM.spdx.json"
            "${SOURCE_DIR}/SHA256SUMS"
          )

          if gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then

            echo "Release ${RELEASE_TAG} already exists."

            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"

            gh release upload "${RELEASE_TAG}" \
              "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Checkout own repository for state update
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update upstream state
        shell: bash
        env:
          DDCLIENT_VERSION: ${{ needs.check.outputs.ddclient_version }}
          LSIO_RELEASE: ${{ needs.check.outputs.lsio_tag }}
          LSIO_BUILD: ${{ needs.check.outputs.lsio_build }}
          IMAGE_VERSION: ${{ needs.check.outputs.image_tag }}
          IMAGE_NAME: ${{ needs.check.outputs.image_name }}
        run: |
          set -euo pipefail

          cd repository

          cat > .upstream <<EOF
          DDCLIENT_VERSION=${DDCLIENT_VERSION}
          LSIO_RELEASE=${LSIO_RELEASE}
          LSIO_BUILD=ls${LSIO_BUILD}
          IMAGE=${IMAGE_NAME}
          IMAGE_VERSION=${IMAGE_VERSION}
          SOURCE_RELEASE=image-${IMAGE_VERSION}
          EOF

          echo "New .upstream:"
          cat .upstream

          if git diff --quiet -- .upstream && \
             git ls-files --error-unmatch .upstream >/dev/null 2>&1; then
            echo ".upstream is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .upstream
          git commit -m "Update upstream state to ${IMAGE_VERSION}"
          git push
