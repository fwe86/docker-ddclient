name: Build ddclient RC

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DDCLIENT_VERSION: v4.0.1-rc.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LinuxServer ddclient
        uses: actions/checkout@v4
        with:
          repository: linuxserver/docker-ddclient
          ref: master

      - name: Set build information
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "LSIO_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docker-ddclient" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --pull \
            --build-arg DDCLIENT_VERSION="${DDCLIENT_VERSION}" \
            --build-arg VERSION="${DDCLIENT_VERSION}-${LSIO_COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            -t "${IMAGE_NAME}:${DDCLIENT_VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Verify ddclient version
        run: |
          docker run --rm \
            --entrypoint ddclient \
            "${IMAGE_NAME}:${DDCLIENT_VERSION}" \
            --version

      - name: Push image
        run: |
          docker push "${IMAGE_NAME}:${DDCLIENT_VERSION}"
          docker push "${IMAGE_NAME}:latest"
